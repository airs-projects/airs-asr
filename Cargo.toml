[package]
name = "airs-asr"
version = "0.1.0"
edition = "2024"

[features]
default = ["whisper", "zipformer"]
whisper = ["dep:sherpa-onnx"]
zipformer = ["dep:sherpa-onnx"]

[[bin]]
name = "airs-asr"
path = "src/main.rs"

[dependencies]
airs-audio = { path = "../airs-audio" }
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
sherpa-onnx = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["sync"] }
thiserror = "2"
